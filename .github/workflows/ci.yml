name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # The core is plain Python; macOS-only tools (say, AppleScript) are mocked in tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv pip install --system -e '.[dev]'

      - name: Test (base install; voice tests skip without the voice extra)
        run: python -m pytest -q -rs
