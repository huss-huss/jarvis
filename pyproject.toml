[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Local-first personal AI assistant for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "ollama>=0.4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
voice = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "silero-vad>=5.0",
    "onnxruntime>=1.16",
    "torch>=2.2",
    "torchaudio>=2.2",
    "pywhispercpp>=1.3",
    "kokoro>=0.9.4",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
